<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>HumanVoiced — record your 30-second sample</title>
<style>body{font-family:system-ui;max-width:640px;margin:2rem auto;padding:0 1rem}</style></head>
<body>
<h1>Record your sample</h1>
<p>Read the Alex café passage naturally (~30s). Nothing uploads until you approve it.</p>
<button id="rec">● Record</button> <button id="stop" disabled>■ Stop</button>
<audio id="play" controls style="display:block;margin:1rem 0"></audio>
<button id="send" disabled>Upload sample</button>
<p id="msg"></p>
<script>
let mr, chunks = [], wavBlob = null;
const msg = t => document.getElementById('msg').textContent = t;
function encodeWav(buffer) {
  const ch0 = buffer.getChannelData(0);
  const n = ch0.length, sr = buffer.sampleRate;
  const ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE');
  ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, ch0[i])) * 32767, true);
  return new Blob([ab], {type: 'audio/wav'});
}
document.getElementById('rec').onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  mr = new MediaRecorder(stream);
  chunks = [];
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = async () => {
    const blob = new Blob(chunks, {type: mr.mimeType});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    wavBlob = encodeWav(decoded);
    document.getElementById('play').src = URL.createObjectURL(wavBlob);
    document.getElementById('send').disabled = false;
    msg('Review it. Upload only if you are happy.');
  };
  mr.start();
  document.getElementById('rec').disabled = true;
  document.getElementById('stop').disabled = false;
};
document.getElementById('stop').onclick = () => {
  mr.stop();
  document.getElementById('rec').disabled = false;
  document.getElementById('stop').disabled = true;
};
document.getElementById('send').onclick = async () => {
  const q = new URLSearchParams(location.search);
  const session = q.get('session') || '';
  if (!session) { msg('Sign in first.'); return; }
  const blob = wavBlob;
  if (!blob) { msg('Record first.'); return; }
  const r = await fetch('/v1/narrators/me/sample', {
    method: 'POST', headers: {'X-HV-Session': session, 'Content-Type': 'audio/wav'}, body: blob});
  msg(r.ok ? 'Sample saved to your profile.' : 'Upload failed: ' + await r.text());
};
</script>
</body></html>
