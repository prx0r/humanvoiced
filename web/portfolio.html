<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>HumanVoiced portfolio</title>
<style>body{font-family:system-ui;max-width:640px;margin:2rem auto;padding:0 1rem}</style></head>
<body>
<div id="p">Loading…</div>
<script>
const API = 'https://api.humanvoiced.com';
(async () => {
  const h = new URLSearchParams(location.search).get('h') || 'alex';
  const box = document.getElementById('p');
  let prof;
  try {
    const r = await fetch(API + '/v1/voices/by-handle/' + encodeURIComponent(h));
    if (!r.ok) throw 0;
    prof = await r.json();
  } catch { box.innerHTML = '<h1>Voice not found</h1><p>Ask them for their HumanVoiced link.</p>'; return; }
  const rep = prof.reputation || {};
  const vec = rep.vector || {};
  const samps = prof.samples || [];
  box.innerHTML = `<h1>${prof.handle || prof.narrator_id}</h1>
    <p>${(prof.languages || []).join(' · ')}</p>
    <h2>Samples (${samps.length})</h2>` +
    samps.map((s, i) => {
      const sha = s.sha256 || s, kind = s.kind || 'natural';
      return `<p><b>${kind}</b><br><audio controls preload="none" src="${API}/v1/voices/${prof.narrator_id}/sample?sha=${sha}"></audio></p>`;
    }).join('') +
    `<h2>Record</h2><p>Jobs ${rep.completed || 0} · on-time ${vec.D ?? '—'} · quality ${vec.Q ?? '—'}</p>
    <p><a href="/onboard.html">Get your own voice page</a></p>`;
})();
</script>
</body></html>
